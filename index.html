<meta charset="UTF-8"/>

<title>Hello Sridhar ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@400;600;700&family=Permanent+Marker&family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --orange:#ff6b00;--orange2:#ff9f43;--red:#e84545;
  --blue:#1a6fff;--cyan:#00d4ff;--purple:#9b5de5;
  --yellow:#ffd166;--white:#f5f0ff;--bg:#07030f;
  --card:rgba(8,4,20,0.85);
}
html,body{
  width:100%;height:100%;
  font-family:'Chakra Petch',sans-serif;
  background:var(--bg);color:var(--white);
  overflow:hidden;
}

/* ══ TWO PAGE SLIDE ══ */
.pages{
  display:flex;width:200%;height:100vh;
  transition:transform 0.65s cubic-bezier(0.77,0,0.175,1);
}
.pages.on-p2{transform:translateX(-50%);}
.page{
  width:50%;height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:20px 0;
}

/* ══ BACKGROUND ══ */
.bg-wrap{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-base{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 10%,rgba(255,107,0,0.18) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 90% 85%,rgba(26,111,255,0.16) 0%,transparent 65%),
    radial-gradient(ellipse 40% 50% at 50% 50%,rgba(232,69,69,0.07) 0%,transparent 70%),
    linear-gradient(170deg,#07030f 0%,#0d0520 45%,#060210 100%);
}
.swirl-bg{
  position:absolute;top:50%;left:50%;
  width:min(700px,130vw);height:min(700px,130vw);
  transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(255,107,0,0.04) 30deg,transparent 60deg,rgba(255,107,0,0.06) 90deg,transparent 120deg,rgba(255,107,0,0.04) 150deg,transparent 180deg,rgba(232,69,69,0.05) 210deg,transparent 240deg,rgba(255,107,0,0.04) 270deg,transparent 300deg,rgba(255,107,0,0.05) 330deg,transparent 360deg);
  animation:swirlSpin 20s linear infinite;filter:blur(2px);
}
@keyframes swirlSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.speed{
  position:absolute;inset:-50%;width:200%;height:200%;
  background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg,rgba(255,107,0,0.015) 0.2deg,transparent 0.5deg);
  animation:spinSpeed 30s linear infinite;
}
@keyframes spinSpeed{to{transform:rotate(360deg);}}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.17;animation:floatO ease-in-out infinite alternate;pointer-events:none;}
.ob1{width:45vw;height:45vw;max-width:480px;max-height:480px;background:radial-gradient(#ff6b00,#e84545);top:-20%;left:-15%;animation-duration:14s;}
.ob2{width:38vw;height:38vw;max-width:400px;max-height:400px;background:radial-gradient(#1a6fff,#00d4ff);top:50%;right:-12%;animation-duration:11s;animation-delay:-5s;}
.ob3{width:30vw;height:30vw;max-width:350px;max-height:350px;background:radial-gradient(#9b5de5,#ff6b00);bottom:-15%;left:28%;animation-duration:16s;animation-delay:-9s;}
@keyframes floatO{from{transform:translate(0,0);}to{transform:translate(38px,28px);}}
canvas{position:absolute;inset:0;z-index:1;}

/* ══ CARD ══ */
.card{
  position:relative;z-index:2;
  width:min(430px,92vw);
  background:var(--card);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:18px;
  padding:clamp(26px,5vw,44px) clamp(20px,5.5vw,40px) clamp(22px,4vw,36px);
  text-align:center;
  box-shadow:0 0 0 1px rgba(255,107,0,0.2),inset 0 1px 0 rgba(255,255,255,0.05),0 30px 80px rgba(0,0,0,0.7);
}
.p1 .card{animation:cardIn 1s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(0.9);}to{opacity:1;transform:translateY(0) scale(1);}}

.card-border{
  position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:conic-gradient(from var(--ca,0deg),var(--orange),var(--yellow),var(--red),var(--blue),var(--cyan),var(--orange));
  padding:1.5px;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:cborder 5s linear infinite;
}
@keyframes cborder{to{--ca:360deg;}}
@property --ca{syntax:'<angle>';initial-value:0deg;inherits:false;}
.mc{position:absolute;width:18px;height:18px;border-color:rgba(255,107,0,0.8);border-style:solid;}
.mc.tl{top:9px;left:9px;border-width:2px 0 0 2px;border-radius:3px 0 0 0;}
.mc.tr{top:9px;right:9px;border-width:2px 2px 0 0;border-radius:0 3px 0 0;}
.mc.bl{bottom:9px;left:9px;border-width:0 0 2px 2px;border-radius:0 0 0 3px;}
.mc.br{bottom:9px;right:9px;border-width:0 2px 2px 0;border-radius:0 0 3px 0;}

/* ══ AVATAR ══ */
.av-wrap{
  position:relative;width:clamp(110px,26vw,138px);height:clamp(110px,26vw,138px);
  margin:0 auto clamp(12px,2.5vw,18px);
  animation:popIn 0.8s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(0.15) rotate(-20deg);}to{opacity:1;transform:scale(1) rotate(0);}}
.av-ring{width:100%;height:100%;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,var(--orange),var(--yellow),var(--red),var(--orange));box-shadow:0 0 28px rgba(255,107,0,0.8),0 0 55px rgba(232,69,69,0.35);}
.av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#120820;}
.av-inner img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;display:block;}
.dr{position:absolute;border-radius:50%;pointer-events:none;}
.dr1{inset:-8px;border:1.5px dashed rgba(255,107,0,0.5);animation:spinR 7s linear infinite;}
.dr2{inset:-18px;border:1.5px dotted rgba(0,212,255,0.3);animation:spinR 12s linear infinite reverse;}
@keyframes spinR{to{transform:rotate(360deg);}}
.pr{position:absolute;border-radius:50%;border:2px solid rgba(255,107,0,0.6);animation:pout 2.3s ease-out infinite;}
.pr2{inset:-16px;border-color:rgba(232,69,69,0.3);animation-delay:0.85s;}.pr1{inset:-4px;}
@keyframes pout{0%{transform:scale(1);opacity:0.8;}100%{transform:scale(1.3);opacity:0;}}

/* ══ TEXT ══ */
.hello-tag{font-size:clamp(9px,2.2vw,11px);letter-spacing:5px;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:4px;display:inline-flex;align-items:center;gap:5px;animation:fadeUp 0.5s 0.32s ease both;}
.hello-tag::before,.hello-tag::after{content:'⬡';font-size:9px;opacity:0.6;color:var(--orange);}
h1{font-family:'Bebas Neue',cursive;font-size:clamp(50px,12vw,70px);font-weight:400;letter-spacing:5px;line-height:0.95;margin-bottom:5px;animation:fadeUp 0.5s 0.38s ease both;text-shadow:3px 3px 0 rgba(255,107,0,0.5),6px 6px 0 rgba(232,69,69,0.25),0 0 30px rgba(255,107,0,0.3);}
.name-g{background:linear-gradient(120deg,var(--orange) 0%,var(--yellow) 30%,var(--red) 60%,var(--orange2) 100%);background-size:250% 250%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gshift 4s ease infinite;}
@keyframes gshift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.divider{display:flex;align-items:center;gap:8px;max-width:190px;margin:clamp(7px,1.8vw,11px) auto clamp(9px,2.2vw,13px);animation:fadeUp 0.5s 0.44s ease both;}
.dline{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--orange),transparent);}
.dsym{font-size:13px;display:inline-block;color:var(--yellow);text-shadow:0 0 8px var(--orange);animation:spinStar 5s linear infinite;}
@keyframes spinStar{to{transform:rotate(360deg);}}

/* ══ QUOTE ══ */
.quote{font-size:clamp(13px,3.2vw,15px);font-weight:600;line-height:1.5;white-space:nowrap;margin:0 auto clamp(16px,3.2vw,22px);animation:fadeUp 0.5s 0.5s ease both;padding:clamp(9px,2vw,12px) clamp(12px,3vw,18px);background:rgba(255,107,0,0.07);border-radius:12px;border-left:3px solid var(--orange);border-right:3px solid var(--red);position:relative;display:inline-block;width:100%;}
.quote::before{content:'❝';position:absolute;top:-10px;left:10px;font-size:18px;color:var(--orange);opacity:0.5;font-family:serif;}
.q-love{color:var(--yellow);font-weight:700;}
.q-with{color:rgba(245,240,255,0.45);font-weight:400;}
.q-peace{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;}
.emoji-wrap{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:5px;}
.ep{display:inline-block;font-size:clamp(16px,4vw,20px);animation:efloat 2s ease-in-out infinite alternate;-webkit-text-fill-color:initial;}
.ep:nth-child(2){animation-delay:0.4s;}.ep:nth-child(3){animation-delay:0.8s;}
@keyframes efloat{from{transform:translateY(0) scale(1) rotate(-5deg);}to{transform:translateY(-7px) scale(1.22) rotate(5deg);}}

/* ══ BUTTONS ══ */
.links{display:flex;flex-direction:column;gap:clamp(7px,1.8vw,10px);animation:fadeUp 0.5s 0.56s ease both;}
.link-btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:clamp(10px,2.2vw,12px) 18px;border-radius:10px;
  text-decoration:none;font-family:'Chakra Petch',sans-serif;
  font-size:clamp(12px,3vw,13.5px);font-weight:700;letter-spacing:0.5px;
  border:1.5px solid transparent;position:relative;overflow:hidden;
  transition:transform 0.18s ease,box-shadow 0.2s ease;
  cursor:pointer;background:none;width:100%;
}
.link-btn::before{content:'';position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);transition:left 0.45s ease;}
.link-btn:hover::before{left:150%;}
.link-btn:hover{transform:translateY(-4px) scale(1.015);}
.link-btn:active{transform:translateY(-1px);}
.link-btn svg{width:16px;height:16px;flex-shrink:0;position:relative;z-index:1;}
.link-btn span{position:relative;z-index:1;}

.btn-yt{background:linear-gradient(135deg,rgba(255,50,30,0.2),rgba(255,107,0,0.1));border-color:rgba(255,60,30,0.5);color:#ffbbaa;}
.btn-yt:hover{box-shadow:0 7px 26px rgba(255,50,30,0.45),0 0 0 1px rgba(255,70,30,0.75);}
.btn-ig{background:linear-gradient(135deg,rgba(200,70,200,0.18),rgba(255,107,0,0.1));border-color:rgba(200,80,180,0.5);color:#ffccee;}
.btn-ig:hover{box-shadow:0 7px 26px rgba(200,70,200,0.45),0 0 0 1px rgba(220,80,180,0.8);}
.btn-dc{background:linear-gradient(135deg,rgba(88,101,242,0.25),rgba(155,93,229,0.15));border-color:rgba(88,101,242,0.6);color:#c5c8ff;}
.btn-dc:hover{box-shadow:0 7px 26px rgba(88,101,242,0.5),0 0 0 1px rgba(88,101,242,0.9);}

.footer{margin-top:clamp(12px,2.5vw,18px);font-family:'Permanent Marker',cursive;font-size:clamp(11px,2.8vw,13px);background:linear-gradient(90deg,var(--orange),var(--yellow),var(--red),var(--orange2));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gshift 3s ease infinite,fadeUp 0.5s 0.66s ease both;}

/* ══ PAGE 2 ══ */
.p2 .card.anim{animation:slideIn 0.65s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes slideIn{from{opacity:0;transform:translateX(60px) scale(0.92);}to{opacity:1;transform:translateX(0) scale(1);}}
.back-btn{display:flex;align-items:center;gap:8px;background:rgba(255,107,0,0.1);border:1.5px solid rgba(255,107,0,0.35);color:#ffffff;padding:9px 16px;border-radius:10px;font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;transition:background 0.18s,transform 0.18s;letter-spacing:0.5px;width:100%;justify-content:flex-start;}
.back-btn:hover{background:rgba(255,107,0,0.18);transform:translateX(-4px);}

/* Glitch animated title */
.p2-title{font-family:'Bebas Neue',cursive;font-size:clamp(28px,7vw,36px);letter-spacing:4px;margin-bottom:16px;color:#ffffff;position:relative;display:inline-block;width:100%;}
.p2-title span{position:relative;display:inline-block;}
.p2-title span::before,.p2-title span::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;}
.p2-title span::before{color:#ff4444;animation:glitchT 3s infinite;clip-path:polygon(0 0,100% 0,100% 40%,0 40%);}
.p2-title span::after{color:#00d4ff;animation:glitchB 3s infinite;clip-path:polygon(0 60%,100% 60%,100% 100%,0 100%);}
@keyframes glitchT{0%,90%,100%{transform:translate(0);}91%{transform:translate(-3px,1px);}93%{transform:translate(3px,-1px);}95%{transform:translate(-2px,0);}}
@keyframes glitchB{0%,90%,100%{transform:translate(0);}91%{transform:translate(3px,-1px);}93%{transform:translate(-3px,1px);}95%{transform:translate(2px,0);}}

/* Clean dark channel cards — no color bg, only logo colored */
.yt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.yt-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:26px 14px;border-radius:16px;text-decoration:none;
  background:rgba(10,5,25,0.85);
  border:1px solid rgba(255,255,255,0.08);
  color:#ffd4aa;position:relative;overflow:hidden;
  transition:transform 0.25s ease;
}

/* Neon border trace using pseudo element */
.yt-card::before{
  content:'';position:absolute;
  top:-2px;left:-2px;right:-2px;bottom:-2px;
  border-radius:17px;
  background:conic-gradient(from var(--angle,0deg),transparent 70%,#ff0000 80%,#ff6b00 88%,#ffffff 92%,#ff6b00 96%,transparent 100%);
  animation:borderTrace 2.5s linear infinite;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  padding:1.5px;
  z-index:0;
}
.yt-card:nth-child(2)::before{animation-delay:-1.25s;}
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
@keyframes borderTrace{to{--angle:360deg;}}

.yt-card:hover{transform:translateY(-5px) scale(1.03);}
.yt-card::after{
  content:'';position:absolute;inset:0;border-radius:16px;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,60,30,0.12),transparent 70%);
  transition:opacity 0.3s ease;z-index:0;
}
.yt-card:hover::after{opacity:1;}
.yt-card>*{position:relative;z-index:1;}

/* YouTube logo — colored and floating */
.yt-card svg{
  width:40px;height:40px;
  color:#ff0000;
  filter:drop-shadow(0 0 10px rgba(255,0,0,0.8)) drop-shadow(0 0 20px rgba(255,60,30,0.4));
  animation:floatLogo 2.5s ease-in-out infinite alternate;
}
.yt-card:nth-child(2) svg{animation-delay:0.6s;}
@keyframes floatLogo{from{transform:translateY(0) scale(1);}to{transform:translateY(-6px) scale(1.08);}}

.yt-card-label{font-family:'Chakra Petch',sans-serif;font-size:clamp(11px,2.8vw,13px);font-weight:700;color:#ffffff;text-align:center;line-height:1.4;}
.yt-card-sub{font-size:clamp(9px,2.2vw,10px);color:rgba(255,220,100,0.75);font-weight:400;margin-top:2px;}
.anim .yt-card:nth-child(1){animation:popCard 0.5s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;}
.anim .yt-card:nth-child(2){animation:popCard 0.5s 0.22s cubic-bezier(0.34,1.56,0.64,1) both;}
/* Floating particles canvas inside card */
canvas.card-particles{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;pointer-events:none;z-index:0;}

@media(max-width:480px){
  .page{align-items:center;padding:18px 0;overflow-y:auto;}
  .card{margin:auto 0;max-height:calc(100vh - 36px);}
  .quote{white-space:normal;}
  h1{font-size:clamp(44px,13vw,60px);}
  .yt-grid{gap:10px;}
  .yt-card{padding:18px 10px;}
}
@media(max-width:400px){
  .page{padding:14px 0;}
  .card{max-height:calc(100vh - 28px);}
  .quote{white-space:normal;}
  h1{font-size:clamp(44px,13vw,60px);}
  .yt-grid{gap:10px;}
  .yt-card{padding:18px 10px;}
  .av-wrap{width:clamp(96px,22vw,120px);height:clamp(96px,22vw,120px);margin-bottom:10px;}
  .links{gap:7px;}
  .footer{margin-top:10px;}
}
</style>

<script>
function goP2(){
  document.getElementById('pages').classList.add('on-p2');

// ══ NARUTO & BORUTO DRAW HELPERS (shared) ══
function drawNaruto(ct,x,y,t){
  ct.save();ct.translate(x,y);
  // Straight upright — no lean
  ct.scale(1.0,1.0);ct.globalAlpha=1.0;
  // Speed lines
  ct.strokeStyle='rgba(255,107,0,0.35)';ct.lineWidth=2;
  for(let i=0;i<3;i++){ct.beginPath();ct.moveTo(-90-i*12,-28+i*10);ct.lineTo(-22,-28+i*10);ct.stroke();}
  // Body
  ct.fillStyle='#ff6b00';ct.fillRect(-10,-38,20,26);
  // Head band
  ct.fillStyle='#4a4a7a';ct.fillRect(-12,-62,24,6);
  // Head
  ct.fillStyle='#f4c07a';ct.beginPath();ct.arc(0,-52,12,0,Math.PI*2);ct.fill();
  // Hair
  ct.fillStyle='#f0c040';ct.beginPath();ct.moveTo(-8,-62);ct.quadraticCurveTo(-4,-76,0,-66);ct.quadraticCurveTo(4,-78,8,-62);ct.fill();
  // Eyes
  ct.fillStyle='#1a1a2a';ct.beginPath();ct.arc(-4,-54,2,0,Math.PI*2);ct.fill();ct.beginPath();ct.arc(4,-54,2,0,Math.PI*2);ct.fill();
  // Whisker marks
  ct.strokeStyle='#b8856a';ct.lineWidth=1.2;
  [[-8,-53,-3,-52],[-8,-56,-3,-56],[3,-53,8,-52],[3,-56,8,-56]].forEach(([x1,y1,x2,y2])=>{ct.beginPath();ct.moveTo(x1,y1);ct.lineTo(x2,y2);ct.stroke();});
  // Arms swing straight front-back
  const a1=Math.sin(t*10)*14;ct.strokeStyle='#ff6b00';ct.lineWidth=5;ct.lineCap='round';
  ct.beginPath();ct.moveTo(-10,-33);ct.lineTo(-22+a1,-22);ct.stroke();
  ct.beginPath();ct.moveTo(10,-33);ct.lineTo(22-a1,-22);ct.stroke();
  // Legs run
  const l1=Math.sin(t*10)*0.8;ct.lineWidth=6;
  ct.beginPath();ct.moveTo(-5,-12);ct.lineTo(-14+Math.sin(l1)*18,18);ct.stroke();
  ct.beginPath();ct.moveTo(5,-12);ct.lineTo(14+Math.sin(l1+Math.PI)*18,18);ct.stroke();
  // Shadow
  ct.globalAlpha=0.2+0.1*Math.abs(Math.sin(t*8));ct.fillStyle='rgba(255,107,0,0.4)';
  ct.beginPath();ct.ellipse(-18,18,18,7,0,0,Math.PI*2);ct.fill();
  ct.restore();
}
function drawBoruto(ct,x,y,t){
  ct.save();ct.translate(x,y);ct.scale(-1.0,1.0);
  // Straight upright — no lean
  ct.globalAlpha=1.0;
  // Speed lines
  ct.strokeStyle='rgba(100,180,255,0.3)';ct.lineWidth=2;
  for(let i=0;i<3;i++){ct.beginPath();ct.moveTo(-90-i*12,-28+i*10);ct.lineTo(-22,-28+i*10);ct.stroke();}
  // Body
  ct.fillStyle='#1a6fff';ct.fillRect(-10,-38,20,26);
  // Head band
  ct.fillStyle='#aaaaff';ct.fillRect(-12,-62,24,6);
  // Head
  ct.fillStyle='#f4c07a';ct.beginPath();ct.arc(0,-52,12,0,Math.PI*2);ct.fill();
  // Hair
  ct.fillStyle='#f0d060';ct.beginPath();ct.moveTo(-8,-62);ct.quadraticCurveTo(0,-80,8,-62);ct.fill();
  // Eyes
  ct.fillStyle='#1a2a4a';ct.beginPath();ct.arc(-4,-54,2.2,0,Math.PI*2);ct.fill();ct.beginPath();ct.arc(4,-54,2.2,0,Math.PI*2);ct.fill();
  // Arms swing
  const a1=Math.sin(t*10)*0.7;ct.strokeStyle='#1a6fff';ct.lineWidth=6;ct.lineCap='round';
  ct.beginPath();ct.moveTo(-10,-33);ct.lineTo(-22+Math.cos(a1)*12,-22+Math.sin(a1)*10);ct.stroke();
  ct.beginPath();ct.moveTo(10,-33);ct.lineTo(22+Math.cos(a1+Math.PI)*12,-22+Math.sin(a1+Math.PI)*10);ct.stroke();
  // Legs run
  const l1=Math.sin(t*10)*0.8;ct.lineWidth=6;
  ct.beginPath();ct.moveTo(-5,-12);ct.lineTo(-14+Math.sin(l1)*18,18);ct.stroke();
  ct.beginPath();ct.moveTo(5,-12);ct.lineTo(14+Math.sin(l1+Math.PI)*18,18);ct.stroke();
  // Shadow
  ct.globalAlpha=0.15+0.1*Math.abs(Math.sin(t*7));ct.fillStyle='rgba(100,180,255,0.4)';
  ct.beginPath();ct.ellipse(0,22,16,6,0,0,Math.PI*2);ct.fill();
  ct.restore();
}

function makeCanvas(sid,lid){
  const c=document.getElementById(sid),cx=c.getContext('2d');
  let W,H,stars=[],nodes=[];
  const rand=(a,b)=>a+Math.random()*(b-a);
  function rsz(){W=c.width=innerWidth;H=c.height=innerHeight;}
  rsz();window.addEventListener('resize',rsz);
  stars=Array.from({length:160},()=>({x:rand(0,W),y:rand(0,H),r:rand(0.3,1.4),sp:rand(0.003,0.011),ph:rand(0,Math.PI*2),col:['#ffd4aa','#ffccaa','#aaddff','#fffde7','#fff'][Math.floor(Math.random()*5)]}));
  nodes=Array.from({length:20},()=>({x:rand(0,W),y:rand(0,H),vx:rand(-0.12,0.12),vy:rand(-0.12,0.12),r:rand(1,2),col:['#ff6b00','#ffd166','#e84545','#00d4ff','#ff9f43'][Math.floor(Math.random()*5)]}));
  let t=0;
  (function loop(){
    cx.clearRect(0,0,W,H);t+=0.016;
    stars.forEach(s=>{cx.globalAlpha=0.25+0.75*(0.5+0.5*Math.sin(t*s.sp*60+s.ph));cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=s.col;cx.fill();});
    cx.globalAlpha=1;
    nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;});
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){cx.beginPath();cx.moveTo(nodes[i].x,nodes[i].y);cx.lineTo(nodes[j].x,nodes[j].y);cx.strokeStyle=nodes[i].col;cx.globalAlpha=(1-d/110)*0.13;cx.lineWidth=0.5;cx.stroke();}}
    cx.globalAlpha=1;
    nodes.forEach(n=>{cx.beginPath();cx.arc(n.x,n.y,n.r,0,Math.PI*2);cx.fillStyle=n.col;cx.shadowBlur=7;cx.shadowColor=n.col;cx.globalAlpha=0.7;cx.fill();cx.shadowBlur=0;});
    cx.globalAlpha=1;requestAnimationFrame(loop);
  })();

  // ── Particle + Naruto & Boruto on same lc canvas ──
  const cv=document.getElementById(lid),ct=cv.getContext('2d');
  const cols=['#ff6b00','#ffd166','#e84545','#ff9f43','#00d4ff','#ffb380'];
  let W2,H2,items=[];
  // Resize: track new size but DON'T reset canvas (that causes flash).
  // Instead, use a pending resize flag.
  let pendingW=innerWidth,pendingH=innerHeight;
  W2=cv.width=pendingW; H2=cv.height=pendingH;
  window.addEventListener('resize',()=>{pendingW=innerWidth;pendingH=innerHeight;});
  class Item{
    constructor(i=false){this.reset(i);}
    reset(i=false){this.x=Math.random()*W2;this.y=i?Math.random()*H2:-12;this.col=cols[Math.floor(Math.random()*cols.length)];this.isL=Math.random()>0.85;this.sz=this.isL?Math.random()*4+2:Math.random()*2.5+1;this.vy=Math.random()*0.65+0.22;this.vx=(Math.random()-0.5)*0.4;this.rot=Math.random()*Math.PI*2;this.rv=(Math.random()-0.5)*0.035;this.life=0;this.ml=Math.random()*240+150;}
    update(){this.life++;this.y+=this.vy;this.x+=this.vx;this.rot+=this.rv;if(this.life>this.ml||this.y>H2+15)this.reset();}
    draw(){const r=this.life/this.ml;const a=r<0.12?r/0.12:r>0.78?(1-r)/0.22:1;ct.save();ct.translate(this.x,this.y);ct.rotate(this.rot);ct.globalAlpha=a*0.8;ct.shadowBlur=this.sz*5;ct.shadowColor=this.col;if(this.isL){ct.beginPath();ct.ellipse(0,0,this.sz*2.2,this.sz,0,0,Math.PI*2);ct.fillStyle=this.col;ct.fill();}else{ct.beginPath();ct.arc(0,0,this.sz,0,Math.PI*2);ct.fillStyle=this.col;ct.fill();}ct.restore();}
  }
  for(let i=0;i<35;i++)items.push(new Item(true));

  // Runner state — starts off-screen
  let nX=-120, bX=pendingW+120, nT=0, bT=0, lastTs=0;

  (function loop2(ts){
    // Apply resize only at frame start (avoids mid-draw flash)
    if(pendingW!==W2||pendingH!==H2){W2=cv.width=pendingW;H2=cv.height=pendingH;}
    ct.clearRect(0,0,W2,H2);ct.shadowBlur=0;
    items.forEach(p=>{p.update();p.draw();});
    ct.globalAlpha=1;ct.shadowBlur=0;

    // Runner timing — same normal speed for both
    const dt=Math.min((ts-lastTs)/1000,0.05);lastTs=ts;
    nT+=dt;bT+=dt;
    nX += W2 / 6 * dt;  if(nX > W2 + 120) nX = -120;
    bX -= W2 / 6 * dt;  if(bX < -120) bX = W2 + 120;

    // Read actual card position relative to its page container (canvas-local coords)
    const pageClass = sid === 'sc1' ? '.p1' : '.p2';
    const cardEl = document.querySelector(pageClass + ' .card');
    let cardTop2, cardBot2, cardLeft2, cardW2, cardH2;
    if(cardEl){
      const pageEl = document.querySelector(pageClass);
      const pr = pageEl ? pageEl.getBoundingClientRect() : {top:0,left:0};
      const r = cardEl.getBoundingClientRect();
      cardTop2  = r.top  - pr.top;
      cardBot2  = r.bottom - pr.top;
      cardLeft2 = r.left - pr.left;
      cardW2    = r.width;
      cardH2    = r.height;
    } else {
      cardW2    = Math.min(430, W2*0.92);
      cardH2    = Math.min(H2*0.82, 680);
      cardLeft2 = (W2 - cardW2) / 2;
      cardTop2  = (H2 - cardH2) / 2;
      cardBot2  = (H2 + cardH2) / 2;
    }

    // Naruto: feet snug at cardTop
    const nY = cardTop2 - 18;
    // Boruto: head top edge (y-64) touches cardBot → bY = cardBot2 + 74
    const bY = cardBot2 + 74;

    // No clip — characters run full width, naturally behind card via z-index
    drawNaruto(ct, nX, nY, nT);
    drawBoruto(ct, bX, bY, bT);

    requestAnimationFrame(loop2);
  })(0);
}


// ── Floating particles inside channel cards ──
function initCardParticles(){
  document.querySelectorAll('canvas.card-particles').forEach(cv=>{
    const ct=cv.getContext('2d');
    const cols=['#ff2200','#ff6b00','#ffd166','#ffffff','#ff4444'];
    let W,H,pts=[];
    function rsz(){
      const r=cv.parentElement.getBoundingClientRect();
      W=cv.width=r.width||160;H=cv.height=r.height||120;
    }
    rsz();
    new ResizeObserver(rsz).observe(cv.parentElement);
    for(let i=0;i<22;i++){
      pts.push({
        x:Math.random()*W,y:Math.random()*H,
        r:Math.random()*2+0.5,
        vx:(Math.random()-0.5)*0.4,
        vy:-(Math.random()*0.5+0.2),
        col:cols[Math.floor(Math.random()*cols.length)],
        life:Math.random(),ml:Math.random()*0.6+0.4
      });
    }
    (function loop(){
      ct.clearRect(0,0,W,H);
      pts.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;p.life+=0.004;
        if(p.life>p.ml||p.y<-4){
          p.x=Math.random()*W;p.y=H+4;
          p.life=0;p.ml=Math.random()*0.6+0.4;
          p.col=cols[Math.floor(Math.random()*cols.length)];
        }
        const a=p.life<0.15?p.life/0.15:p.life>0.75?(1-p.life)/0.25:1;
        ct.save();
        ct.globalAlpha=a*0.75;
        ct.shadowBlur=p.r*6;ct.shadowColor=p.col;
        ct.fillStyle=p.col;
        ct.beginPath();ct.arc(p.x,p.y,p.r,0,Math.PI*2);ct.fill();
        ct.restore();
      });
      requestAnimationFrame(loop);
    })();
  });
}
initCardParticles();

makeCanvas('sc1','lc1');
makeCanvas('sc2','lc2');

document.addEventListener('click',e=>{
  const cols=['#ff6b00','#ffd166','#e84545','#ff9f43','#00d4ff'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div'),col=cols[i%cols.length],sz=4+Math.random()*5;
    el.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:${sz}px;height:${sz}px;border-radius:50%;background:${col};pointer-events:none;z-index:9999;box-shadow:0 0 12px ${col};`;
    document.body.appendChild(el);
    const ang=i*(Math.PI*2/10),dist=42+Math.random()*35,tx=Math.cos(ang)*dist,ty=Math.sin(ang)*dist;
    let t=0;(function a(){t+=0.06;el.style.transform=`translate(${tx*t}px,${ty*t+45*t*t}px)`;el.style.opacity=String(1-t);if(t<1)requestAnimationFrame(a);else el.remove();})();
  }
});
